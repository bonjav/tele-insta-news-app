name: Build and Deploy to App Stores

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

jobs:
  # Run tests first
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run TypeScript check
        run: npx tsc --noEmit

      - name: ✅ Run linter
        run: npm run lint

  # Build for iOS
  build-ios:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == null)
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build iOS app
        run: |
          if [[ "${{ github.event.inputs.deploy_type }}" == "production" || "${{ github.ref }}" == refs/tags/v* ]]; then
            eas build --platform ios --profile production-ios --non-interactive
          else
            eas build --platform ios --profile production-ios --non-interactive
          fi

  # Build for Android
  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == null)
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup Google Services
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: 🔧 Setup Play Store Service Account
        run: echo '${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}' > playstore-service-account.json

      - name: 🚀 Build Android app
        run: |
          if [[ "${{ github.event.inputs.deploy_type }}" == "production" || "${{ github.ref }}" == refs/tags/v* ]]; then
            eas build --platform android --profile production-android --non-interactive
          else
            eas build --platform android --profile production-android --non-interactive
          fi

  # Submit to App Store (iOS)
  submit-ios:
    needs: build-ios
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == null)
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Submit to App Store
        run: |
          if [[ "${{ github.event.inputs.deploy_type }}" == "production" || "${{ github.ref }}" == refs/tags/v* ]]; then
            eas submit --platform ios --profile production-release --non-interactive
          else
            eas submit --platform ios --profile production --non-interactive
          fi

  # Submit to Play Store (Android)
  submit-android:
    needs: build-android
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == null)
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup Play Store Service Account
        run: echo '${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}' > playstore-service-account.json

      - name: 🚀 Submit to Play Store
        run: |
          if [[ "${{ github.event.inputs.deploy_type }}" == "production" || "${{ github.ref }}" == refs/tags/v* ]]; then
            eas submit --platform android --profile production-release --non-interactive
          else
            eas submit --platform android --profile production --non-interactive
          fi

  # Notify deployment status
  notify:
    needs: [submit-ios, submit-android]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: 📱 Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.platform || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.deploy_type || 'internal' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS Build**: ${{ needs.submit-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Build**: ${{ needs.submit-android.result }}" >> $GITHUB_STEP_SUMMARY 