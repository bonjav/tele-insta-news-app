name: Release to App Stores

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run tests
        run: |
          npx tsc --noEmit
          npm run lint

      - name: 🔧 Setup Google Services
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: 🔧 Setup Play Store Service Account
        run: echo '${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}' > playstore-service-account.json

      - name: 🚀 Build and Submit to Stores
        run: |
          # Build for both platforms
          eas build --platform all --profile production --non-interactive --wait
          
          # Submit to stores
          eas submit --platform all --profile production-release --non-interactive

      - name: 📱 Release Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: iOS App Store & Google Play Store" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Submitted for review" >> $GITHUB_STEP_SUMMARY 